{% extends 'base.html' %}
{% block title %}{{ t('Вход через ЭЦП') }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 620px;">
        <div class="card-body">
            <h3 class="text-center mb-4">🔑 {{ t('Вход через ЭЦП') }}</h3>
            <p class="text-center text-muted">
                {{ t('Убедитесь, что программа NCALayer запущена.') }}
            </p>

            <button onclick="startEDSLogin()" class="btn btn-success btn-lg w-100 py-3 mb-3">
                {{ t('Выбрать ключ ЭЦП и войти') }}
            </button>

            <div id="eds-status" class="mt-3"></div>
            <div id="key-list" class="mt-3"></div>

            <a href="{{ url_for('login') }}" class="btn btn-link w-100 mt-3">
                {{ t('← Обычный вход (email + пароль)') }}
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.2/axios.min.js"></script>

<script>
const NCALAYER_URL = "wss://127.0.0.1:13579";
let ws = null;
let keysList = [];

// Строки для JS берём из t() через Jinja
const JS_T = {
    selectKey:       "{{ t('Выберите ключ ЭЦП:') }}",
    iin:             "{{ t('ИИН:') }}",
    serial:          "{{ t('Серийный:') }}",
    keySelected:     "{{ t('Выбран ключ:') }}",
    readingCert:     "{{ t('Читаем сертификат...') }}",
    connecting:      "{{ t('Подключение к NCALayer...') }}",
    connected:       "{{ t('Подключено. Запрашиваем список ключей...') }}",
    cancelled:       "{{ t('Ошибка: Действие отменено пользователем') }}",
    noKeys:          "{{ t('❌ Не найдено ключей ЭЦП') }}",
    oneKey:          "{{ t('Найден один ключ. Читаем сертификат...') }}",
    keysFound:       "{{ t('Найдено ключей:') }}",
    selectBelow:     "{{ t('Выберите ниже:') }}",
    iinFound:        "{{ t('ИИН найден:') }}",
    signingIn:       "{{ t('Выполняем вход...') }}",
    success:         "{{ t('✅ Вход выполнен успешно! Перенаправление...') }}",
    userNotFound:    "{{ t('Пользователь не найден') }}",
    serverError:     "{{ t('Ошибка связи с сервером') }}",
    noIin:           "{{ t('❌ Не удалось извлечь ИИН из сертификата') }}",
    noConnect:       "{{ t('❌ Не удалось подключиться к NCALayer.') }}",
    launch:          "{{ t('Запустите NCALayer') }}",
    restart:         "{{ t('Перезапустите программу NCALayer') }}",
    tryBrowser:      "{{ t('Попробуйте браузер Chrome / Edge') }}",
    key:             "{{ t('Ключ') }}",
    connClosed:      "{{ t('Соединение закрыто') }}",
};

function showStatus(html, type = "info") {
    document.getElementById("eds-status").innerHTML = 
        `<div class="alert alert-${type}">${html}</div>`;
}

function showKeyList(keys) {
    let html = `<h5 class="mt-3">${JS_T.selectKey}</h5><div class="list-group">`;
    
    keys.forEach((key, index) => {
        const name = key.commonName || key.subjectCn || key.subjectName || `${JS_T.key} ${index + 1}`;
        const iin = key.iin || '—';
        
        html += `
            <button class="list-group-item list-group-item-action" 
                    onclick="selectKey(${index})">
                <strong>${name}</strong><br>
                <small>${JS_T.iin} ${iin} | ${JS_T.serial} ${key.serialNumber || key.serial || '—'}</small>
            </button>`;
    });
    
    html += `</div>`;
    document.getElementById("key-list").innerHTML = html;
}

function selectKey(index) {
    const key = keysList[index];
    if (!key) return;

    document.getElementById("key-list").innerHTML = '';
    showStatus(`${JS_T.keySelected} <strong>${key.commonName || JS_T.key}</strong><br>${JS_T.readingCert}`, "info");

    ws.send(JSON.stringify({
        "module": "kz.gov.pki.ncalayer",
        "method": "getCertificateInfo",
        "args": [key]
    }));
}

function startEDSLogin() {
    document.getElementById("key-list").innerHTML = '';
    showStatus(JS_T.connecting, "info");

    ws = new WebSocket(NCALAYER_URL);

    ws.onopen = () => {
        console.log("✅ NCALayer подключён");
        showStatus(JS_T.connected, "info");

        ws.send(JSON.stringify({
            "module": "kz.gov.pki.ncalayer",
            "method": "getKeys",
            "args": ["AUTH", ""]
        }));
    };

    ws.onmessage = (e) => {
        try {
            const res = JSON.parse(e.data);
            console.log("Ответ от NCALayer:", res);

            if (res.code !== "200") {
                showStatus(JS_T.cancelled, "danger");
                if (ws) ws.close();
                return;
            }

            if (res.method === "getKeys") {
                keysList = res.response || [];
                
                if (keysList.length === 0) {
                    showStatus(JS_T.noKeys, "warning");
                    return;
                }

                if (keysList.length === 1) {
                    showStatus(JS_T.oneKey, "info");
                    selectKey(0);
                } else {
                    showStatus(`${JS_T.keysFound} ${keysList.length}. ${JS_T.selectBelow}`, "info");
                    showKeyList(keysList);
                }
            }

            else if (res.method === "getCertificateInfo") {
                const cert = res.response;
                
                let iin = cert.iin;
                if (!iin && cert.subjectDn) {
                    const match = cert.subjectDn.match(/IIN=(\d{12})/i);
                    if (match) iin = match[1];
                }

                if (!iin) {
                    showStatus(JS_T.noIin, "danger");
                    if (ws) ws.close();
                    return;
                }

                showStatus(`${JS_T.iinFound} <strong>${iin}</strong><br>${JS_T.signingIn}`, "info");

                axios.post('/login-eds', { eds_iin: iin })
                    .then(r => {
                        if (r.data.status === 'ok') {
                            showStatus(JS_T.success, "success");
                            setTimeout(() => {
                                window.location.href = r.data.redirect || '/profile';
                            }, 1000);
                        } else {
                            showStatus(r.data.message || JS_T.userNotFound, "danger");
                        }
                    })
                    .catch(() => showStatus(JS_T.serverError, "danger"))
                    .finally(() => { if (ws) ws.close(); });
            }
        } catch (err) {
            console.error(err);
        }
    };

    ws.onerror = () => {
        showStatus(`
            ${JS_T.noConnect}<br><br>
            • ${JS_T.launch}<br>
            • ${JS_T.restart}<br>
            • ${JS_T.tryBrowser}
        `, "danger");
    };

    ws.onclose = () => console.log(JS_T.connClosed);
}
</script>
{% endblock %}
